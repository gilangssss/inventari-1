
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Peminjaman Inventaris</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f1f4;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            min-height: 520px;
            margin: auto;
            background: #fff9ec;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px #00000015;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 25px;
            background: #f2e5c9;
            padding: 12px 25px;
            border-radius: 15px;
            flex: 1;
        }

        .menu a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            white-space: nowrap;
        }

        .admin {
            font-weight: bold;
            padding: 10px;
            white-space: nowrap;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding: 0 5px 0 35px;
        }

        .header h1 {
            font-size: 35px;
            font-weight: 900;
            line-height: 1.05;
            max-width: 650px;
        }

        /* Tanggal dan waktu */
        .datetime {
            min-width: 230px;
            padding-top: 5px;
        }

        .date, .time {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .date-icon, .time-icon {
            font-size: 30px;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .header {
                flex-direction: column;
                padding: 0;
            }

            .header h1 {
                font-size: 28px;
            }

            .datetime {
                margin-top: 10px;
            }

            .navbar {
                flex-direction: column;
                align-items: stretch;
            }

            .menu {
                flex-wrap: wrap;
                gap: 12px;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="menu">
            <a href="index.html">📦 Dashboard</a>
            <a href="data_barang.html">📂 Data Barang</a>
            <a href="form_barang.html">🛒 Form Tambah/Edit Barang</a>
        </div>

        <div class="admin">🌿 ADMIN</div>
    </nav>

    <!-- Judul dan tanggal waktu -->
    <div class="header">

        <h1>
            SELAMAT DATANG DI WEBSITE
            PEMINJAMAN INVENTARIS
        </h1>

        <div class="datetime">
            <div class="date">
                <span class="date-icon">🕒</span>
                <span id="tanggal">Memuat tanggal...</span>
            </div>

            <div class="time">
                <span class="time-icon">🗓️</span>
                <span id="waktu">00:00:00 WIB</span>
            </div>
        </div>

    </div>

</div>

<script>
    function tampilkanTanggalWaktu() {
        const sekarang = new Date();

        const tanggal = sekarang.toLocaleDateString("id-ID", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

        const waktu = sekarang.toLocaleTimeString("id-ID", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            timeZone: "Asia/Jakarta"
        });

        document.getElementById("tanggal").textContent = tanggal;
        document.getElementById("waktu").textContent = waktu + " WIB";
    }

    tampilkanTanggalWaktu();
    setInterval(tampilkanTanggalWaktu, 1000);
</script>

</body>
</html>
