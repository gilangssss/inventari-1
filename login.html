
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Peminjaman Inventaris</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f1f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Ukuran sama dengan dashboard */
        .container {
            width: 100%;
            max-width: 1200px;
            min-height: 520px;
            background: #fff9ec;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px #00000015;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form login */
        .login-box {
            width: 100%;
            max-width: 500px;
        }

        .logo {
            font-size: 35px;
            color: #006633;
            margin-bottom: 25px;
        }

        .welcome {
            color: #006633;
            font-size: 15px;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 35px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            max-width: 300px;
            height: 35px;
            border: none;
            border-radius: 20px;
            background: #c4bebe;
            padding: 0 15px;
            outline: none;
        }

        input:focus {
            background: #e0dada;
            border: 1px solid #006633;
        }

        .forgot {
            display: block;
            max-width: 300px;
            text-align: right;
            font-size: 13px;
            color: #111;
            text-decoration: none;
            margin-top: -8px;
            margin-bottom: 15px;
        }

        .forgot:hover {
            color: #006633;
            text-decoration: underline;
        }

        button {
            width: 100%;
            max-width: 300px;
            height: 40px;
            background: #006633;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #004d26;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .login-box {
                max-width: 100%;
            }

            input,
            button,
            .forgot {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">🌿</div>

            <p class="welcome">selamat datang kembali</p>

            <h1>Masuk akun anda</h1>

            <form onsubmit="login(event)">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata sandi</label>
                    <input type="password" id="password" required>
                </div>

                <a href="#" class="forgot" onclick="lupaPassword()">
                    lupa kata sandi?
                </a>

                <button type="submit">
                    MASUK KE DASHBOARD &gt;
                </button>

            </form>

        </div>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (email === "admin@gmail.com" &&
                password === "admin123") {

                window.location.href = "index.html";

            } else {
                alert("Email atau kata sandi salah!");
            }
        }

        function lupaPassword() {
            alert("Silakan hubungi administrator untuk reset kata sandi.");
        }
    </script>

</body>
</html>
