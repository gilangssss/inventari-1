<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tambah/Edit Barang - Inventari</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>⬡ Inventari</h2>
        <nav>
            <a href="dashboard.html">⌂ Dashboard</a>
            <a href="kategori.html">▤ Kategori Barang</a>
            <a href="barang.html" class="active">▣ Data Barang</a>
            <a href="peminjaman.html">◷ Peminjaman</a>
            <a href="pengguna.html">♙ Pengguna</a>
            <a href="login.html" class="logout">⇥ Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button type="button" id="menuToggle"
                aria-label="Tampilkan atau sembunyikan menu">☰</button>
            <span>Admin</span>
        </header>

        <section class="content">
            <div class="welcome">
                <h1>Form Tambah/Edit Barang</h1>
                <p id="tanggalWaktu"></p>
            </div>

            <section class="form-container">
                <h2 id="judulForm">Form Tambah Barang</h2>

                <form id="formBarang" class="form-barang">
                    <div class="form-group">
                        <label for="kode">Kode Barang</label>
                        <input type="text" id="kode" placeholder="Contoh: Y009" required>
                    </div>

                    <div class="form-group">
                        <label for="nama">Nama Barang</label>
                        <input type="text" id="nama" placeholder="Masukkan nama barang" required>
                    </div>

                    <div class="form-group">
                        <label for="kategori">Kategori</label>
                        <select id="kategori" required>
                            <option value="">Pilih kategori</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="jumlah">Jumlah Barang</label>
                        <input type="number" id="jumlah" min="1" step="1"
                               placeholder="Masukkan jumlah" required>
                    </div>

                    <div class="form-group">
                        <label for="kondisi">Kondisi</label>
                        <select id="kondisi" required>
                            <option value="">Pilih kondisi</option>
                            <option value="Baik">Baik</option>
                            <option value="Rusak Ringan">Rusak Ringan</option>
                            <option value="Rusak Berat">Rusak Berat</option>
                        </select>
                    </div>

                    <div class="aksi-form">
                        <button type="submit" class="button" id="tombolSimpan">SIMPAN &gt;</button>
                        <a href="barang.html" class="button">Batal</a>
                        <p id="pesan" class="pesan" role="status"></p>
                    </div>
                </form>
            </section>
        </section>
    </main>
</div>

<script src="../assets/js/script.js"></script>
<script>
const form = document.getElementById("formBarang");
const pesan = document.getElementById("pesan");
const kodeEdit = new URLSearchParams(window.location.search).get("kode");
let barang = ambilArray(KUNCI_BARANG) || [];

function isiPilihanKategori(terpilih) {
    const select = document.getElementById("kategori");
    const kategori = (ambilArray(KUNCI_KATEGORI) || [])
        .map(item => typeof item === "string" ? item : String(item.nama || ""))
        .filter(nama => nama.trim() !== "");

    // Kategori lama milik barang yang sedang diedit tetap ditampilkan
    if (terpilih && !kategori.includes(terpilih)) {
        kategori.push(terpilih);
    }

    kategori.forEach(nama => {
        const opsi = document.createElement("option");
        opsi.value = nama;
        opsi.textContent = nama;
        select.appendChild(opsi);
    });

    if (terpilih) {
        select.value = terpilih;
    }
}

const barangDiedit = kodeEdit
    ? barang.find(item => item.kode === kodeEdit)
    : null;

isiPilihanKategori(barangDiedit ? barangDiedit.kategori : "");

if (barangDiedit) {
    document.getElementById("judulForm").textContent = "Form Edit Barang";
    document.getElementById("kode").value = barangDiedit.kode;
    document.getElementById("kode").readOnly = true;
    document.getElementById("nama").value = barangDiedit.nama;
    document.getElementById("jumlah").value = barangDiedit.jumlah;
    document.getElementById("kondisi").value = barangDiedit.kondisi;
} else if (kodeEdit) {
    pesan.textContent = "Barang dengan kode " + kodeEdit + " tidak ditemukan.";
}

form.addEventListener("submit", function (event) {
    event.preventDefault();

    const data = {
        kode: document.getElementById("kode").value.trim(),
        nama: document.getElementById("nama").value.trim(),
        kategori: document.getElementById("kategori").value,
        jumlah: Number(document.getElementById("jumlah").value),
        kondisi: document.getElementById("kondisi").value
    };

    if (!data.kode || !data.nama || !data.kategori || !data.kondisi ||
        !Number.isInteger(data.jumlah) || data.jumlah < 1) {
        pesan.textContent =
            "Periksa semua isian. Jumlah harus berupa bilangan bulat minimal 1.";
        return;
    }

    if (barangDiedit) {
        const index = barang.findIndex(item => item.kode === barangDiedit.kode);
        barang[index] = data;
    } else {
        const duplikat = barang.some(item =>
            String(item.kode).toLowerCase() === data.kode.toLowerCase()
        );

        if (duplikat) {
            pesan.textContent = "Kode barang sudah digunakan. Gunakan kode lain.";
            return;
        }

        barang.push(data);
    }

    simpanArray(KUNCI_BARANG, barang);
    alert("Data barang berhasil disimpan!");
    window.location.href = "barang.html";
});
</script>
</body>
</html>
