<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventari</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="logo">⬡</div>

        <h1>Inventari</h1>
        <p class="subtitle">Silakan masuk ke sistem inventaris</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Masukkan username"
                       autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Masukkan password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="button">Masuk</button>

            <p id="pesanLogin" class="message" role="status"></p>
        </form>

        <a class="back-link" href="../index.html">← Kembali ke halaman utama</a>
    </main>

    <script src="../assets/js/script.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const pesan = document.getElementById("pesanLogin");

            if (username === "admin" && password === "admin123") {
                window.location.href = "dashboard.html";
            } else {
                pesan.textContent = "Username atau password salah!";
            }
        });
    </script>
</body>
</html>
